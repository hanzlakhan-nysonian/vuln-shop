version: "3"
services:
  web:
    build: .
    privileged: true
    ports:
      - "3000:3000"
      - "9229:9229"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - NODE_ENV=development
      - JWT_SECRET=secret123
  db:
    image: mysql:5.6
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_ALLOW_EMPTY_PASSWORD=yes
